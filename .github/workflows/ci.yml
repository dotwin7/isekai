name: ISEKAI CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Validate Foundation structure
        run: isekai validate --foundation foundation
      - name: Report Foundation release readiness
        shell: bash
        run: |
          set +e
          isekai release-check --foundation foundation
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 1

  adapter-contract:
    name: Adapter contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run adapter contract tests
        run: python -m pytest -q tests/test_adapter_contract.py
