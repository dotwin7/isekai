[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isekai-ai-dlc-runtime"
version = "0.1.0"
description = "Project-local ISEKAI AI-DLC runtime with host-specific Skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = ["ai", "agent", "software-delivery", "governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/dotwin7/isekai"
Repository = "https://github.com/dotwin7/isekai.git"
Documentation = "https://github.com/dotwin7/isekai/tree/master/docs"
Issues = "https://github.com/dotwin7/isekai/issues"

[project.scripts]
isekai = "isekai.cli:main"

[project.optional-dependencies]
test = ["pytest==9.0.2", "mypy==1.16.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src/isekai"]
strict = false
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.setuptools.package-data]
isekai = ["data/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
