[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isekai-agent-plugin"
version = "0.1.0"
description = "ISEKAI AI-DLC agent plugin with local Core runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = ["ai", "agent", "software-delivery", "governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/dotwin7/isekai"
Repository = "https://github.com/dotwin7/isekai.git"
Documentation = "https://github.com/dotwin7/isekai/tree/master/docs"
Issues = "https://github.com/dotwin7/isekai/issues"

[project.scripts]
isekai = "isekai.cli:main"

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
isekai = ["data/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
